<script>
    (function() {
      const USERS = [
        { username: "Victor",    password: "innvida2026" },
        { username: "Antonio",   password: "innvida2026" },
        { username: "Guillermo", password: "innvida2026" },
        { username: "Rene",    password: "innvida2026" }
        { username: "Victor",    password: "innvida2026", role: "full" },
        { username: "Antonio",   password: "innvida2026", role: "full" },
        { username: "Guillermo", password: "innvida2026", role: "full" },
        { username: "Rene",      password: "innvida2026", role: "full" },
        { username: "Marymar",   password: "Marymar1",    role: "limited" },
        { username: "Ly",        password: "Ly1",         role: "limited" }
      ];

      function isValidCredentials(user, pass) {
      function findUser(user, pass) {
        if (!user || !pass) return false;
        const u = user.trim().toLowerCase();
        return USERS.some(function(item) {
        return USERS.find(function(item) {
          return item.username.toLowerCase() === u && item.password === pass;
        });
        }) || null;
      }

      function showDashboard() {
      function showDashboard(user) {
        window.INNVIDA_DASHBOARD_ROLE = user.role;
        window.INNVIDA_DASHBOARD_USER = user.username;
        var login = document.getElementById("login-container");
        var app   = document.getElementById("appContainer");
        if (login) login.style.display = "none";
        if (app)   app.style.display   = "";
        document.dispatchEvent(new CustomEvent("innvida-session-ready"));
      }

      document.addEventListener("DOMContentLoaded", function() {
        var saved = window.localStorage ? localStorage.getItem("innvidaDashboardUser") : null;
        var savedUser = saved ? USERS.find(function(item) {
          return item.username.toLowerCase() === saved.trim().toLowerCase();
        }) : null;
        if (saved) {
          showDashboard();
        if (savedUser) {
          showDashboard(savedUser);
          return;
        }

        var form  = document.getElementById("login-form");
        if (!form) return;

        form.addEventListener("submit", function(e) {
          e.preventDefault();
          var userInput = document.getElementById("username");
          var passInput = document.getElementById("password");
          var errorElem = document.getElementById("login-error");

          var user = userInput ? userInput.value : "";
          var pass = passInput ? passInput.value : "";

          if (isValidCredentials(user, pass)) {
          var userProfile = findUser(user, pass);
          if (userProfile) {
            if (window.localStorage) {
              localStorage.setItem("innvidaDashboardUser", user);
              localStorage.setItem("innvidaDashboardUser", userProfile.username);
            }
            showDashboard();
            showDashboard(userProfile);
          } else {
            if (errorElem) errorElem.style.display = "block";
          }
        });
      });
    })();
  </script>
